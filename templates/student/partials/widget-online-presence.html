<!-- WIDGET TRỰC TUYẾN DÀNH CHO HỌC SINH -->
<div id="online-presence-widget" class="online-presence-widget" onclick="app.toggleOnlinePresenceSidebar()" title="Xem ai đang online">
    <span class="online-indicator-glow"></span>
    <i class="fa-solid fa-users"></i>
    <span id="online-count-badge" class="online-count-badge">0</span>
</div>

<!-- SIDEBAR TRƯỢT HIỂN THỊ BẠN HỌC TRỰC TUYẾN -->
<div id="online-presence-sidebar" class="online-presence-sidebar hidden">
    <div class="sidebar-presence-header">
        <h3><i class="fa-solid fa-bolt" style="color:#eab308; margin-right:6px;"></i> Bạn Học Trực Tuyến</h3>
        <button class="btn-close-presence" onclick="app.toggleOnlinePresenceSidebar()">&times;</button>
    </div>
    <div class="sidebar-presence-search">
        <input type="text" id="presence-search-input" placeholder="Tìm kiếm bạn học..." oninput="app.filterPresenceList()">
    </div>
    <div class="sidebar-presence-content" id="online-presence-list">
        <!-- Render động bằng JS -->
    </div>
</div>
