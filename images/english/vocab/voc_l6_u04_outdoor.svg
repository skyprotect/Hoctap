      <text x="60" y="70" font-family="'Segoe UI', Arial, sans-serif" font-size="34" font-weight="900" fill="#2563eb" text-anchor="middle">O</text>
      <circle cx="78" cy="42" r="5" fill="#f59e0b"/>
