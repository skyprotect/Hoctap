<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" width="400" height="250">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f472b6"/>
      <stop offset="100%" stop-color="#db2777"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-opacity="0.2"/>
    </filter>
  </defs>
  <!-- Card Background -->
  <rect x="10" y="10" width="380" height="230" rx="20" fill="url(#bg)" filter="url(#shadow)"/>
  
  <!-- Topic & Level Badge -->
  <rect x="24" y="24" width="76" height="24" rx="12" fill="#ffffff" opacity="0.25"/>
  <text x="62" y="41" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="900" fill="#ffffff" text-anchor="middle">Pre-A1</text>

  <rect x="108" y="24" width="110" height="24" rx="12" fill="#ffffff" opacity="0.2"/>
  <text x="163" y="41" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">WEATHER</text>

  <!-- Illustration Scene -->
  <g id="scene_content">
    
      <circle cx="160" cy="110" r="42" fill="#facc15" stroke="#eab308" stroke-width="4"/>
      <path d="M 180 150 Q 220 110 260 150 Q 290 140 300 165 Q 290 190 200 190 Z" fill="#e0f2fe" opacity="0.95"/>
    
  </g>

  <!-- Title Bottom Ribbon -->
  <rect x="24" y="195" width="352" height="34" rx="10" fill="#0f172a" opacity="0.65"/>
  <text x="200" y="218" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="800" fill="#ffffff" text-anchor="middle">A Sunny Morning</text>
</svg>